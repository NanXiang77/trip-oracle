name: wake-cloud

# 作用：每天 08:00 和 20:00（北京时间）把云端容器拉起来并确认可用。
#
# 为什么不能只 ping /health：
#   免费档的容器有两种停法——
#     Sleeping（自动休眠）→ 有请求就会自己启动，ping 有效
#     Stopped（深度停止）→ 外部请求一律 503，ping 永远叫不醒
#   所以必须调用 SnapDeploy 的启动接口（POST /containers/{id}/start），
#   它对接 Stopped 状态同样有效。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   SNAPDEPLOY_API_KEY       sd_pat_... 开头的 token（scope: deploy 或 manage）
#   SNAPDEPLOY_CONTAINER_ID  容器 id，见 snapdeploy.dev 容器详情或 API list
#
# 注意：GitHub 的 cron 用 UTC。00:00 UTC = 08:00 北京，12:00 UTC = 20:00 北京。
# 高峰期可能延迟几分钟，不影响结果——容器醒来后 WAKE_COLLECT_H
# 会判断数据是否过期并后台补采。

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEALTH_URL: https://trip-oracle-dcf89.containers.snapdeploy.app/health
      API_BASE: https://snapdeploy.dev/api/mobile
    steps:
      - name: Start container (works even when Stopped)
        env:
          KEY: ${{ secrets.SNAPDEPLOY_API_KEY }}
          CID: ${{ secrets.SNAPDEPLOY_CONTAINER_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$CID" ]; then
            echo "::warning::缺少 SNAPDEPLOY_API_KEY 或 SNAPDEPLOY_CONTAINER_ID，跳过 start，只做轮询"
            exit 0
          fi
          echo "::group::POST /containers/$CID/start"
          # 402 = 免费时长用完；403 = token 权限不足；都如实打印，不重试
          code=$(curl -s -o /tmp/start.json -w '%{http_code}' -m 45 \
                 -X POST "$API_BASE/containers/$CID/start" \
                 -H "Authorization: Bearer $KEY" \
                 -H 'Content-Type: application/json' || true)
          echo "HTTP $code"
          head -c 400 /tmp/start.json 2>/dev/null || true
          echo "::endgroup::"
          if [ "$code" = "402" ]; then
            echo "::error::免费运行时长已用完（402），需要等下个计费周期"
            exit 1
          fi

      - name: Wait until /health answers with JSON
        run: |
          for i in $(seq 1 14); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' -m 40 "$HEALTH_URL" || true)
            first=$(head -c 1 /tmp/h.json 2>/dev/null || echo '')
            echo "第 $i 次：HTTP $code"
            if [ "$code" = "200" ] && [ "$first" = "{" ]; then
              echo "已就绪，最新快照：$(python3 -c "import json;print(json.load(open('/tmp/h.json')).get('latest_snapshot'))" 2>/dev/null || echo '?')"
              exit 0
            fi
            sleep 15
          done
          echo "::error::启动后 3.5 分钟内仍未就绪，请到 SnapDeploy 看 Logs"
          exit 1
